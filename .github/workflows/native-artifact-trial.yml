name: native Node artifact trial

on: pull_request

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  ALPINE_AMD64: alpine@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            target: aarch64-apple-darwin
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.15.1"

      - name: Create scratch directory
        run: |
          mkdir -p .work/tmp

      - name: Cache verified build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: ${{ matrix.target }}-inputs-${{ hashFiles('sources.lock.json', 'bootstrap.lock.json') }}
          restore-keys: ${{ matrix.target }}-inputs-

      - name: Build and verify on macOS
        if: runner.os == 'macOS'
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: make doctor build verify TARGET="${{ matrix.target }}" JOBS="$(sysctl -n hw.ncpu)"

      - name: Build and verify in Alpine musl
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --platform linux/amd64 --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env TMPDIR=/work/.work/tmp \
            --env TARGET \
            "$ALPINE_AMD64" sh -ec '
              apk add --no-cache python3=3.14.10-r1 build-base=0.5-r4 clang22=22.1.3-r2 linux-headers=7.0.0-r1 perl=5.42.3-r0 pkgconf=2.5.1-r0 git=2.54.1-r0
              git config --global --add safe.directory /work
              make doctor build verify TARGET="$TARGET" JOBS="$(nproc)"
            '

      - name: Record exact archive digests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          git diff --exit-code
          shasum -a 256 dist/"$TARGET"/*.tar.xz
